<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pancha Prakriti Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#111;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;

}

.card{

width:420px;
max-width:95%;
background:#1d1d1d;
padding:30px;
border-radius:20px;
box-shadow:0 0 30px rgba(0,0,0,.5);

}

h1{

text-align:center;
color:#D4AF37;
margin-bottom:8px;

}

.subtitle{

text-align:center;
color:#999;
margin-bottom:25px;

}

#reader{

width:100%;
margin-top:20px;
margin-bottom:20px;

}

input{

width:100%;
padding:15px;
border:none;
border-radius:10px;
font-size:16px;
margin-top:15px;

}

button{

width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
font-size:17px;
font-weight:bold;
cursor:pointer;

}

.scan{

background:#333;
color:white;

}

.verify{

background:#D4AF37;
color:black;

}

.check{

background:#28a745;
color:white;

}

#result{

margin-top:25px;

}

.success{

color:#64ff64;

}

.error{

color:#ff5f5f;

}

.info{

margin-top:12px;
line-height:1.8;

}

</style>

</head>

<body>

<div class="card">

<h1>PANCHA PRAKRITI</h1>

<p class="subtitle">

Ticket Verification System

</p>

<button class="scan" onclick="startScanner()">

📷 Scan QR Code

</button>

<div id="reader"></div>

<input
id="ticket"
placeholder="Enter Ticket ID">

<button
class="verify"
onclick="verifyTicket()">

Verify Ticket

</button>

<div id="result"></div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbzPKf1QpAaJ56ePF9a8vnXlLUPyigQvlLjKEER1mpc9lJXDN7dX4Ajix_-v_U597N7q/exec";

let scanner=null;

function startScanner(){

if(scanner){

scanner.stop().catch(()=>{});

}

document.getElementById("reader").innerHTML="";

scanner=new Html5Qrcode("reader");

scanner.start(

{

facingMode:"environment"

},

{

fps:10,
qrbox:250

},

(decodedText)=>{

document.getElementById("ticket").value=decodedText;

scanner.stop();

verifyTicket();

},

(error)=>{}

).catch(err=>{

alert("Unable to access camera.");

console.log(err);

});

}

async function verifyTicket(){

const ticket=document.getElementById("ticket").value.trim();

if(ticket==""){

alert("Please enter a Ticket ID.");

return;

}

try{

console.log("Checking Ticket:",ticket);

const response=await fetch(

API+
"?action=verify&ticket="+
encodeURIComponent(ticket)

);

const data=await response.json();

console.log(data);

const result=document.getElementById("result");

if(!data.success){

result.innerHTML=`

<h2 class="error">

❌ Ticket Not Found

</h2>

`;

return;

}

const t=data.attendee;

result.innerHTML=`

<h2 class="success">

✅ VALID TICKET

</h2>

<div class="info">

<b>Name</b><br>

${t.attendeeName}

<br><br>

<b>Pass Type</b><br>

${t.passType}

<br><br>

<b>Ticket ID</b><br>

${t.ticketID}

<br><br>

<b>Status</b><br>

${t.status}

<br><br>

<b>Scan Count</b><br>

${t.scanCount}

</div>

<button
class="check"
onclick="checkIn('${t.ticketID}')">

CHECK IN

</button>

`;

}catch(err){

console.error(err);

alert(err.message);

}

}

async function checkIn(ticket){

try{

const response=await fetch(

API+
"?action=checkin&ticket="+
encodeURIComponent(ticket)

);

const data=await response.json();

console.log(data);

if(data.success){

alert("✅ Checked In Successfully");

}else{

alert(data.message);

}

verifyTicket();

}catch(err){

console.error(err);

alert(err.message);

}

}

</script>

</body>

</html>
